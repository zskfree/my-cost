[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_NAME = "MyCost"
ONE_API_BASE_URL = "http://47.115.165.231:3000/v1"
MULTIMODAL_MODELS = "gemini-3.5-flash-lite"
TRANSCRIBE_MODEL = "gemini-3.5-transcribe"

[[d1_databases]]
binding = "DB"
database_name = "my-cost"
database_id = "dd9069d9-6911-4bff-a8db-fa438b393e37"
